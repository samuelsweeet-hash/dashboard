<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ironwood Operations — Classroom Prototype</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  :root{
    --ink:#1C1710;
    --sub:#6B6459;
    --line:#E7E2D8;
    --bg:#F6F4EF;
    --card:#FFFFFF;
    --brass:#B8874B;
    --brass-dark:#8C6636;
    --track:#EFEAE0;
    --active-bg:#FBF1DD;
    --active-border:#E7C88A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit; text-decoration:none;}

  /* ---------- TOP BAR ---------- */
  .topbar{
    background:#fff;
    border-bottom:1px solid var(--line);
  }
  .topbar-inner{
    max-width:1080px; margin:0 auto;
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 20px;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:30px;height:30px;border-radius:7px;
    background:linear-gradient(135deg,var(--brass),var(--brass-dark));
    display:flex;align-items:center;justify-content:center;
    color:#fff; font-weight:800; font-size:13px;
  }
  .brand-name{font-weight:700; font-size:14.5px;}
  .brand-sub{font-size:11px; color:var(--sub);}

  .tabs{display:flex; gap:22px; font-size:13px; color:var(--sub);}
  .tabs .active{color:var(--ink); font-weight:600; position:relative;}
  .tabs .active::after{
    content:""; position:absolute; left:0; right:0; bottom:-13px; height:2px; background:var(--ink);
  }
  .tabs span{display:none;}
  @media(min-width:640px){ .tabs span{display:inline;} }

  .ai-banner{
    background:linear-gradient(90deg,#F3E7D6,#F8F2E6);
    border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; gap:12px;
    padding:9px 16px; font-size:12.5px; flex-wrap:wrap; text-align:center;
  }
  .ai-banner b{color:var(--brass-dark);}
  .ai-pill{
    background:var(--ink); color:#fff; font-size:11.5px; font-weight:600;
    padding:6px 12px; border-radius:20px; white-space:nowrap;
  }

  /* ---------- GRID VIEW ---------- */
  #gridView{max-width:1080px; margin:0 auto; padding:22px 20px 60px;}
  .grid-head{margin-bottom:16px;}
  .grid-head h1{font-size:19px; margin:0 0 4px;}
  .grid-head p{font-size:12.5px; color:var(--sub); margin:0;}

  .grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:18px;
  }
  @media(max-width:800px){ .grid{grid-template-columns:repeat(2,1fr);} }
  @media(max-width:520px){ .grid{grid-template-columns:1fr;} }

  .mcard{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .mcard:hover{transform:translateY(-2px); box-shadow:0 8px 20px rgba(28,23,16,0.08);}
  .thumb{
    height:110px;
    display:flex; align-items:center; justify-content:center;
    position:relative;
    color:#fff;
  }
  .thumb .tlabel{
    font-family:'Inter',sans-serif; font-weight:800; font-size:12px;
    letter-spacing:.06em; text-transform:uppercase; text-align:center; padding:0 12px;
    opacity:.92;
  }
  .thumb .tnum{
    position:absolute; top:8px; left:10px; font-size:10.5px; font-weight:700;
    background:rgba(0,0,0,0.28); padding:2px 7px; border-radius:5px; letter-spacing:.04em;
  }
  .mbody{padding:12px 14px 14px;}
  .mtitle{font-size:13.5px; font-weight:700; margin-bottom:3px;}
  .mdesc{font-size:11.5px; color:var(--sub); line-height:1.4; margin-bottom:10px; min-height:30px;}
  .ptrack{height:6px; background:var(--track); border-radius:4px; overflow:hidden; margin-bottom:4px;}
  .pfill{height:100%; background:var(--brass);}
  .ppct{font-size:10px; color:var(--sub); font-weight:600;}
  .locked-badge{
    font-size:9.5px; color:var(--sub); font-weight:600;
    display:flex; align-items:center; gap:4px;
  }

  /* ---------- CLASSROOM VIEW ---------- */
  #classView{display:none;}
  .class-wrap{
    max-width:1080px; margin:0 auto; padding:20px 20px 60px;
    display:flex; gap:22px; align-items:flex-start;
  }
  @media(max-width:760px){ .class-wrap{flex-direction:column;} }

  .back-row{max-width:1080px; margin:14px auto 0; padding:0 20px;}
  .back-btn{
    font-size:12.5px; color:var(--sub); display:inline-flex; align-items:center; gap:6px;
    cursor:pointer;
  }
  .back-btn:hover{color:var(--ink);}

  .sidebar{
    width:270px; flex:none;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px;
  }
  @media(max-width:760px){ .sidebar{width:100%;} }

  .side-eyebrow{font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--sub); font-weight:700; margin-bottom:8px;}
  .side-progress-row{display:flex; align-items:center; gap:8px; margin-bottom:14px;}
  .side-pct{
    background:var(--brass); color:#fff; font-size:10.5px; font-weight:700;
    padding:3px 8px; border-radius:20px; flex:none;
  }
  .side-track{flex:1; height:6px; background:var(--track); border-radius:4px; overflow:hidden;}
  .side-fill{height:100%; background:var(--brass);}

  .lesson-item{
    display:flex; align-items:center; gap:8px;
    padding:9px 8px; border-radius:7px;
    font-size:12.5px; cursor:pointer; color:var(--ink);
    margin-bottom:2px;
  }
  .lesson-item:hover{background:#F4F1EA;}
  .lesson-item.active{background:var(--active-bg); border:1px solid var(--active-border); font-weight:600;}
  .lesson-check{
    width:15px;height:15px; border-radius:50%; border:1.5px solid #C9C2B2; flex:none;
    display:flex; align-items:center; justify-content:center; font-size:9px; color:#fff;
  }
  .lesson-check.done{background:var(--brass); border-color:var(--brass);}
  .lesson-tagmini{
    font-size:9px; color:var(--sub); margin-left:auto; flex:none; text-transform:uppercase; letter-spacing:.03em;
  }

  .content{flex:1; min-width:0;}
  .content-card{
    background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden;
  }
  .content-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px; border-bottom:1px solid var(--line);
  }
  .content-title{font-size:15px; font-weight:700;}
  .complete-circle{
    width:24px;height:24px;border-radius:50%; border:1.5px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--sub);
    cursor:pointer; flex:none;
  }
  .complete-circle.done{background:var(--brass); border-color:var(--brass); color:#fff;}

  .video-box{
    margin:16px 18px 0;
    background:#8A8578;
    border-radius:8px;
    height:280px;
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  @media(max-width:520px){ .video-box{height:180px;} }
  .play-btn{
    width:56px;height:56px;border-radius:50%;
    background:rgba(255,255,255,0.9);
    display:flex; align-items:center; justify-content:center;
    font-size:20px; color:var(--ink);
  }
  .video-tag{
    position:absolute; bottom:10px; left:10px;
    background:rgba(0,0,0,0.45); color:#fff; font-size:10px; padding:3px 8px; border-radius:5px;
  }

  .content-body{padding:16px 18px 20px;}
  .content-desc{font-size:13px; color:#453F35; line-height:1.6; margin-bottom:16px;}
  .content-tags{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:18px;}
  .ctag{
    font-size:10px; text-transform:uppercase; letter-spacing:.04em; font-weight:700;
    padding:4px 8px; border-radius:5px; background:#F4F1EA; color:var(--brass-dark);
    border:1px solid var(--line);
  }
  .nav-row{display:flex; justify-content:space-between; gap:10px; padding-top:14px; border-top:1px solid var(--line);}
  .nav-btn{
    font-size:12.5px; font-weight:600; padding:9px 14px; border-radius:7px; cursor:pointer;
    border:1px solid var(--line); background:#fff; color:var(--ink);
  }
  .nav-btn.primary{background:var(--ink); color:#fff; border-color:var(--ink);}
  .nav-btn[disabled]{opacity:.35; cursor:default;}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark">IO</div>
      <div>
        <div class="brand-name">Ironwood Operations</div>
        <div class="brand-sub">New Agent Training</div>
      </div>
    </div>
    <div class="tabs">
      <a>Community</a>
      <a class="active">Classroom</a>
      <a><span>Calendar</span></a>
      <a><span>Leaderboards</span></a>
    </div>
  </div>
  <div class="ai-banner">
    <span>✨ <b>Bonus:</b> Ask the CA Guidelines GPT anything about Farmers underwriting rules</span>
    <span class="ai-pill">Open Assistant</span>
  </div>
</div>

<!-- ======================= GRID VIEW ======================= -->
<div id="gridView">
  <div class="grid-head">
    <h1>Classroom</h1>
    <p>Tap any module to open its lessons.</p>
  </div>
  <div class="grid" id="gridContainer"></div>
</div>

<!-- ======================= CLASSROOM VIEW ======================= -->
<div class="back-row" id="backRow" style="display:none;">
  <div class="back-btn" onclick="showGrid()">← Back to Classroom</div>
</div>

<div id="classView">
  <div class="class-wrap">
    <div class="sidebar">
      <div class="side-eyebrow" id="sideEyebrow">MODULE</div>
      <div class="side-progress-row">
        <span class="side-pct" id="sidePct">0%</span>
        <div class="side-track"><div class="side-fill" id="sideFill" style="width:0%"></div></div>
      </div>
      <div id="lessonList"></div>
    </div>

    <div class="content">
      <div class="content-card">
        <div class="content-head">
          <div class="content-title" id="lessonTitle">—</div>
          <div class="complete-circle" id="completeCircle" onclick="toggleComplete()">✓</div>
        </div>
        <div class="video-box">
          <div class="play-btn">▶</div>
          <div class="video-tag">Video placeholder</div>
        </div>
        <div class="content-body">
          <p class="content-desc" id="lessonDesc">—</p>
          <div class="content-tags" id="lessonTags"></div>
          <div class="nav-row">
            <button class="nav-btn" id="prevBtn" onclick="stepLesson(-1)">← Previous</button>
            <button class="nav-btn primary" id="nextBtn" onclick="stepLesson(1)">Next →</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const colors = ['#2E2A24','#4A3423','#5B6B6F','#3E4B3E','#4B3E4E','#3E4650','#5C4A2E','#2F4A47','#4A2F3A','#39433E','#463A2E','#33403F','#4A3E23'];

const modules = [
  { key:'day1', num:'DAY 1', title:'Orientation & Systems Setup', desc:'Welcome, access checklist, roadmap.', progress:100,
    lessons:[
      {t:'Welcome & Role Overview', d:'What this role covers and how the program is structured.', tags:['Lesson']},
      {t:'Systems Access Checklist', d:'Confirm logins for Farmers University, Apex, Alta, DYL, AgencyZoom.', tags:['Lesson']},
      {t:'Program Roadmap Walkthrough', d:'How Month 1 and the following weeks fit together.', tags:['Lesson']},
      {t:'Expectations & Gating Policy', d:'Schedule, scoring, and how modules unlock.', tags:['Lesson']}
    ]},
  { key:'w1', num:'WEEK 1', title:'Compliance, Apex & Alta', desc:'Farmers University, Apex, and Alta quoting basics.', progress:60,
    lessons:[
      {t:'Farmers University Compliance', d:'Complete the full compliance course and confirm certification.', tags:['Lesson']},
      {t:'Navigating Apex', d:'Policy lookup, servicing screens, and key functions.', tags:['Lesson']},
      {t:'Quoting in Alta — Core Lessons', d:'Getting comfortable with the Alta quoting interface.', tags:['Lesson']},
      {t:'Try It Yourself: Alta Sample Quote', d:'Build a full quote using the provided sample data.', tags:['Try It Yourself']},
      {t:'Check for Understanding', d:'Short quiz on the Alta workflow. 70%+ to advance, up to 4 attempts.', tags:['Check for Understanding']}
    ]},
  { key:'w2', num:'WEEK 2', title:'Auto Insurance', desc:'Limits, VINs, drivers, garaging, discounts.', progress:0,
    lessons:[
      {t:'CA Required Limits — What They Mean for Clients', d:'How to explain minimum coverage limits in plain terms.', tags:['Lesson']},
      {t:'Entering VINs', d:'Correctly capturing vehicle identification numbers.', tags:['Lesson']},
      {t:'Adding & Excluding Drivers', d:'Household exclusions and what "marking out" means.', tags:['Lesson']},
      {t:'Garaging Addresses', d:'Why garaging address matters for rating.', tags:['Lesson']},
      {t:'Full Coverage vs. Liability & Deductibles', d:'Coverage tiers and deductible options.', tags:['Lesson']},
      {t:'Discounts in Auto', d:'Available discounts and how to apply them.', tags:['Lesson']},
      {t:'Documents: The 7-Step Auto Workflow', d:'Gather info → address → drivers → vehicles → coverages → risk analysis → pre/post-bind docs.', tags:['Documents']},
      {t:'Try It Yourself: Sample Auto Quote', d:'Run the full workflow end-to-end with sample data.', tags:['Try It Yourself']},
      {t:'Check for Understanding', d:'70%+ to advance, up to 4 attempts with different questions each time.', tags:['Check for Understanding']}
    ]},
  { key:'w3', num:'WEEK 3', title:'Home Insurance', desc:'Foremost, CEA, eligibility, documents.', progress:0,
    lessons:[
      {t:'Farmers Eligibility', d:'Single-family homes and condos only.', tags:['Lesson']},
      {t:'Landlord / Dwelling on Foremost', d:'Why and how these route to Foremost instead of Farmers.', tags:['Lesson']},
      {t:'CEA (Earthquake) Quoting', d:'Adding California Earthquake Authority coverage.', tags:['Lesson']},
      {t:'Documents: The 7-Step Home Workflow', d:'Gather info → address → named insureds → dwelling details → coverages → risk analysis → pre/post-bind docs.', tags:['Documents']},
      {t:'Try It Yourself: Sample Home Quote', d:'Run the full workflow end-to-end with sample data.', tags:['Try It Yourself']},
      {t:'Check for Understanding', d:'70%+ to advance, up to 4 attempts.', tags:['Check for Understanding']}
    ]},
  { key:'w4', num:'WEEK 4', title:'Bundling & Umbrella', desc:'Month 1 capstone. 10 exercises, 70%+ to unlock.', progress:0,
    lessons:[
      {t:'Bundled Quote Exercise', d:'Build a combined Home + Auto policy start to finish.', tags:['Try It Yourself']},
      {t:'Umbrella — What It Is', d:'When a client needs umbrella coverage.', tags:['Lesson']},
      {t:'Umbrella — Quoting Overview', d:'One lesson walking through the quoting steps.', tags:['Lesson']},
      {t:'Month 1 Capstone: 10 Practice Exercises', d:'Across Auto / Home / Bundle. 70%+ required to unlock Week 5.', tags:['Check for Understanding']},
      {t:'Final Month 1 Exam', d:'Cumulative check for understanding.', tags:['Check for Understanding']}
    ]},
  { key:'w5', num:'WEEK 5', title:'Brokers: Auto', desc:'Shopping ineligible auto risk to outside carriers.', progress:0,
    lessons:[
      {t:'What "Shopping the Broker Market" Means', d:'When an auto risk is ineligible for Farmers.', tags:['Lesson']},
      {t:'Broker Directory — Auto Carriers', d:'Appetite, submission process, turnaround, contact.', tags:['Lesson']},
      {t:'Packaging a Risk for Broker Submission', d:'What info to gather before shopping it out.', tags:['Lesson']},
      {t:'Try It Yourself: Shop a Sample Risk', d:'Route a sample ineligible auto risk to the right broker.', tags:['Try It Yourself']},
      {t:'Check for Understanding', d:'70%+ to advance, up to 4 attempts.', tags:['Check for Understanding']}
    ]},
  { key:'w6', num:'WEEK 6', title:'Brokers: Home', desc:'Same process, applied to home risk.', progress:0,
    lessons:[
      {t:'Broker-Shopping Process for Home', d:'Same pattern as Auto, applied to Home.', tags:['Lesson']},
      {t:'Broker Directory — Home Carriers', d:'Outside home and dwelling carrier options.', tags:['Lesson']},
      {t:'Broker vs. Foremost vs. CEA', d:'Deciding which path fits the risk.', tags:['Lesson']},
      {t:'Try It Yourself: Shop a Sample Risk', d:'Route a sample ineligible home risk to the right broker.', tags:['Try It Yourself']},
      {t:'Check for Understanding', d:'70%+ to advance, up to 4 attempts.', tags:['Check for Understanding']}
    ]},
  { key:'w7', num:'WEEK 7', title:'Brokers: Commercial + ACORD', desc:'Broker directory plus ACORD form tutorials.', progress:0,
    lessons:[
      {t:'Broker Directory — Commercial Carriers', d:'Organized by appetite and niche.', tags:['Lesson']},
      {t:'ACORD Tutorial — Applications', d:'Walkthrough of the core ACORD application forms.', tags:['Lesson']},
      {t:'ACORD Tutorial — Property & Liability', d:'Filling out supplemental ACORD forms correctly.', tags:['Lesson']},
      {t:'Try It Yourself: Full ACORD Packet', d:'Complete a full submission packet with sample data.', tags:['Try It Yourself']},
      {t:'Check for Understanding', d:'70%+ to advance, up to 4 attempts.', tags:['Check for Understanding']}
    ]},
  { key:'w8', num:'WEEK 8', title:'DYL — Dialing System', desc:'Workflows, dialers, and dial lists.', progress:0,
    lessons:[
      {t:'DYL System Overview', d:'What DYL is and where it fits in your day.', tags:['Lesson']},
      {t:'Setting Up Workflows', d:'Building call workflows step by step.', tags:['Lesson']},
      {t:'Setting Up Dialers & Dial Lists', d:'Configuring dial lists for outreach.', tags:['Lesson']},
      {t:'Try It Yourself: Mock Dialing Workflow', d:'Run through a practice workflow end-to-end.', tags:['Try It Yourself']}
    ]},
  { key:'w9', num:'WEEK 9', title:'AgencyZoom CRM', desc:'Leads, pipeline, notes, policies.', progress:0,
    lessons:[
      {t:'CRM Walkthrough — Leads & Pipeline', d:'Navigating leads and pipeline stages.', tags:['Lesson']},
      {t:'Logging Notes & Call Activity', d:'Keeping a clean activity trail on every lead.', tags:['Lesson']},
      {t:'Quoting Leads & Marking Won/Lost', d:'Moving a lead through to a decision.', tags:['Lesson']},
      {t:'Customer Records & Policy Views', d:'Where policy details live once a client is onboarded.', tags:['Lesson']},
      {t:'Check for Understanding', d:'70%+ to advance, up to 4 attempts.', tags:['Check for Understanding']}
    ]},
  { key:'w10', num:'WEEKS 10–11', title:'Commercial Insurance', desc:'Core Farmers-eligible commercial quoting.', progress:0,
    lessons:[
      {t:'Commercial Quoting Fundamentals', d:'BOP, GL, commercial auto, and property basics.', tags:['Lesson']},
      {t:'Documents: The 7-Step Commercial Workflow', d:'Same structure as Auto/Home, adapted for commercial risk.', tags:['Documents']},
      {t:'Try It Yourself: Sample Commercial Quote', d:'Run the workflow end-to-end with sample data.', tags:['Try It Yourself']},
      {t:'Check for Understanding', d:'70%+ to advance, up to 4 attempts.', tags:['Check for Understanding']}
    ]},
  { key:'w12', num:'WEEK 12+', title:'Life Insurance', desc:'Fundamentals, needs analysis, documents.', progress:0,
    lessons:[
      {t:'Life Insurance Fundamentals', d:'Core product types and how they differ.', tags:['Lesson']},
      {t:'Needs Analysis Conversation', d:'How to talk through coverage needs with a client.', tags:['Lesson']},
      {t:'Documents: The 7-Step Life Workflow', d:'Same structure, adapted for life insurance.', tags:['Documents']},
      {t:'Check for Understanding', d:'70%+ to advance, up to 4 attempts.', tags:['Check for Understanding']}
    ]},
  { key:'bonus', num:'BONUS', title:'CA Guidelines Assistant', desc:'Custom GPT for Farmers underwriting questions.', progress:0,
    lessons:[
      {t:'What the Assistant Can Help With', d:'Quick-reference answers on Farmers CA underwriting guidelines.', tags:['Lesson']},
      {t:'How to Use It Alongside Documents', d:'It supplements — never replaces — the Documents subsections.', tags:['Lesson']}
    ]}
];

let currentModule = null;
let currentLesson = 0;
const completed = {};

function renderGrid(){
  const grid = document.getElementById('gridContainer');
  grid.innerHTML = '';
  modules.forEach((m, i) => {
    const card = document.createElement('div');
    card.className = 'mcard';
    card.onclick = () => openModule(m.key);
    card.innerHTML = `
      <div class="thumb" style="background:${colors[i % colors.length]}">
        <div class="tnum">${m.num}</div>
        <div class="tlabel">${m.title}</div>
      </div>
      <div class="mbody">
        <div class="mtitle">${m.title}</div>
        <div class="mdesc">${m.desc}</div>
        <div class="ptrack"><div class="pfill" style="width:${m.progress}%"></div></div>
        <div class="ppct">${m.progress}% complete</div>
      </div>`;
    grid.appendChild(card);
  });
}

function openModule(key){
  currentModule = modules.find(m => m.key === key);
  currentLesson = 0;
  document.getElementById('gridView').style.display = 'none';
  document.getElementById('classView').style.display = 'block';
  document.getElementById('backRow').style.display = 'block';
  document.getElementById('sideEyebrow').textContent = currentModule.num + ' · ' + currentModule.title;
  renderSidebar();
  renderLesson();
  window.scrollTo(0,0);
}

function showGrid(){
  document.getElementById('gridView').style.display = 'block';
  document.getElementById('classView').style.display = 'none';
  document.getElementById('backRow').style.display = 'none';
  window.scrollTo(0,0);
}

function renderSidebar(){
  const list = document.getElementById('lessonList');
  list.innerHTML = '';
  currentModule.lessons.forEach((l, i) => {
    const row = document.createElement('div');
    row.className = 'lesson-item' + (i === currentLesson ? ' active' : '');
    const key = currentModule.key + '-' + i;
    const done = completed[key];
    row.innerHTML = `
      <span class="lesson-check ${done ? 'done' : ''}">${done ? '✓' : ''}</span>
      <span>${l.t}</span>
      <span class="lesson-tagmini">${l.tags[0]}</span>`;
    row.onclick = () => { currentLesson = i; renderSidebar(); renderLesson(); };
    list.appendChild(row);
  });
  updateSideProgress();
}

function updateSideProgress(){
  const total = currentModule.lessons.length;
  let done = 0;
  currentModule.lessons.forEach((l,i) => { if(completed[currentModule.key+'-'+i]) done++; });
  const pct = Math.round((done/total)*100);
  document.getElementById('sidePct').textContent = pct + '%';
  document.getElementById('sideFill').style.width = pct + '%';
}

function renderLesson(){
  const l = currentModule.lessons[currentLesson];
  document.getElementById('lessonTitle').textContent = l.t;
  document.getElementById('lessonDesc').textContent = l.d;
  const key = currentModule.key + '-' + currentLesson;
  const circle = document.getElementById('completeCircle');
  circle.className = 'complete-circle' + (completed[key] ? ' done' : '');

  const tagWrap = document.getElementById('lessonTags');
  tagWrap.innerHTML = l.tags.map(t => `<span class="ctag">${t}</span>`).join('');

  document.getElementById('prevBtn').disabled = currentLesson === 0;
  document.getElementById('nextBtn').disabled = currentLesson === currentModule.lessons.length - 1;
  document.getElementById('nextBtn').textContent = currentLesson === currentModule.lessons.length - 1 ? 'Last lesson' : 'Next →';
}

function stepLesson(dir){
  const next = currentLesson + dir;
  if(next < 0 || next >= currentModule.lessons.length) return;
  currentLesson = next;
  renderSidebar();
  renderLesson();
}

function toggleComplete(){
  const key = currentModule.key + '-' + currentLesson;
  completed[key] = !completed[key];
  renderSidebar();
  renderLesson();
}

renderGrid();
</script>

</body>
</html>
