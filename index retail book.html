              React.createElement("div", { style: { fontSize: 15, fontWeight: 800, color: "#12203a", marginTop: 2 } }, money(brokerTotals[b]))

        ),
        React.createElement(
          "div",
          { style: { fontSize: 15, fontWeight: 800, color: "#12203a", marginBottom: 10 } },

  function App() {
    const [selectedClientId, setSelectedClientId] = useState(null);
    const selectedClient = CLIENTS.find((c) => c.id === selectedClientId) || null;
    if (!selectedClient) {
      return React.createElement(ClientList, { clients: CLIENTS, onSelect: (c) => setSelectedClientId(c.id) });
    }
    return React.createElement(ClientDetail, { key: selectedClient.id, client: selectedClient, onBack: () => setSelectedClientId(null) });
  }

  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(React.createElement(App));
